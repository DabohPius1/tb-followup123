name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3" virtualenv buildozer

      - name: Write correct buildozer.spec (auto-accepts SDK license)
        run: |
          cat > buildozer.spec <<'SPEC'
          [app]
          title = TB Follow-up Calculator
          package.name = tbfollowup
          package.domain = org.tbfollowup
          source.dir = .
          source.include_exts = py,json,png,jpg,kv
          source.exclude_dirs = bin,.buildozer,.github,.git
          version = 1.0
          requirements = python3,kivy==2.3.0
          orientation = portrait
          fullscreen = 0

          [buildozer]
          log_level = 2
          warn_on_root = 0

          [android]
          android.api = 33
          android.minapi = 23
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          SPEC
          sed -i 's/^          //' buildozer.spec
          cat buildozer.spec

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tb-followup-apk
          path: bin/*.apk
          if-no-files-found: error
